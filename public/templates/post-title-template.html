document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"nl\"><head>\n<meta charset=\"UTF-8\">\n<title>Cinematen — The Odyssey post<\u002Ftitle>\n<style>/* ============================================================\n   CINEMATEN — WEBFONTS\n   Rubik Mono One — brand wordmark (\"CINEMATEN\") only, always uppercase.\n   Rubik (variable, 300–900) — all headings, UI, and body copy.\n   ============================================================ */\n\n@font-face {\n  font-family: \"Rubik\";\n  src: url(\"ab8d5d82-68c0-480c-a8d2-3bcd4caca1c1\") format(\"truetype-variations\"),\n       url(\"ab8d5d82-68c0-480c-a8d2-3bcd4caca1c1\") format(\"truetype\");\n  font-weight: 300 900;\n  font-style: normal;\n  font-display: swap;\n}\n\n@font-face {\n  font-family: \"Rubik Mono One\";\n  src: url(\"f39e2dcb-d2b6-4856-ba5b-05b9c4ac03b4\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   CINEMATEN — COLOR TOKENS\n   Base palette from brand guidelines:\n     Main:      #1c59b4  (Cinematen blue)\n     Dark text: #2d3370  (ink / headline color)\n     Accent:    #67fbe9  (use sparingly — highlights, glints, badges)\n     Dark BG:   #320a28  (deep plum — hero/dark-section background)\n     White:     #ffffff\n   Gradient:    linear-gradient(150deg, #320a28 15%, #1c59b4)\n   ============================================================ */\n\n:root {\n  /* ---- Base ramps (raw values — reach for semantic tokens below first) ---- */\n\n  /* Blue — primary brand color, derived tint/shade ramp around #1c59b4 */\n  --blue-50:  #eaf1fb;\n  --blue-100: #cfe1f6;\n  --blue-200: #a1c3ed;\n  --blue-300: #6fa1e0;\n  --blue-400: #3d7ccf;\n  --blue-500: #1c59b4; /* brand main */\n  --blue-600: #17499a;\n  --blue-700: #123a79;\n  --blue-800: #0e2c5c;\n  --blue-900: #0a1f42;\n\n  /* Ink — dark text color, deep indigo */\n  --ink-50:  #eceef7;\n  --ink-100: #cfd3ea;\n  --ink-300: #7d86bb;\n  --ink-500: #2d3370; /* brand dark text */\n  --ink-700: #1f2450;\n  --ink-900: #14173a;\n\n  /* Accent — mint/cyan glow, sparing use only */\n  --accent-100: #e3fefb;\n  --accent-300: #a6fcf1;\n  --accent-500: #67fbe9; /* brand accent */\n  --accent-700: #16c9b3;\n\n  /* Plum — dark background color */\n  --plum-500: #320a28; /* brand dark bg */\n  --plum-400: #4a1039;\n  --plum-600: #230619;\n  --plum-700: #180411;\n\n  /* Neutrals — cool gray tinted toward the ink hue, for UI chrome/text/borders */\n  --gray-0:   #ffffff;\n  --gray-50:  #f6f7fb;\n  --gray-100: #eceef4;\n  --gray-200: #dadde8;\n  --gray-300: #bfc4d6;\n  --gray-400: #9aa0bb;\n  --gray-500: #757c9c;\n  --gray-600: #565d7c;\n  --gray-700: #3d4260;\n  --gray-800: #282c47;\n  --gray-900: #171a2e;\n  --gray-1000: #0b0c18;\n\n  /* ---- Semantic aliases — use these in components/screens ---- */\n\n  /* Brand */\n  --color-brand: var(--blue-500);\n  --color-brand-hover: var(--blue-600);\n  --color-brand-active: var(--blue-700);\n  --color-brand-subtle: var(--blue-50);\n  --color-accent: var(--accent-500);\n  --color-accent-subtle: var(--accent-100);\n  --color-accent-strong: var(--accent-700);\n\n  /* Surfaces */\n  --surface-page: var(--gray-0);\n  --surface-card: var(--gray-0);\n  --surface-sunken: var(--gray-50);\n  --surface-raised: var(--gray-0);\n  --surface-overlay: rgba(11, 12, 24, 0.5);\n  --surface-dark: var(--plum-500);\n  --surface-dark-raised: var(--plum-400);\n  --surface-brand: var(--blue-500);\n\n  /* Text */\n  --text-heading: var(--ink-500);\n  --text-body: var(--gray-700);\n  --text-muted: var(--gray-500);\n  --text-placeholder: var(--gray-400);\n  --text-on-brand: #ffffff;\n  --text-on-dark: #ffffff;\n  --text-on-dark-muted: var(--gray-300);\n  --text-link: var(--blue-500);\n  --text-link-hover: var(--blue-600);\n\n  /* Borders */\n  --border-default: var(--gray-200);\n  --border-strong: var(--gray-300);\n  --border-brand: var(--blue-500);\n  --border-on-dark: rgba(255, 255, 255, 0.16);\n\n  /* Feedback */\n  --color-success: #1f9e6d;\n  --color-success-subtle: #e3f8ee;\n  --color-warning: #b8791c;\n  --color-warning-subtle: #fdf1de;\n  --color-danger: #c23b4b;\n  --color-danger-subtle: #fbe7e9;\n  --color-info: var(--blue-500);\n  --color-info-subtle: var(--blue-50);\n\n  /* Focus */\n  --ring-focus: var(--accent-500);\n\n  /* Gradient */\n  --gradient-brand: linear-gradient(150deg, #320a28 15%, #1c59b4 100%); /* @kind color */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   CINEMATEN — TYPOGRAPHY TOKENS\n   Brand wordmark \"CINEMATEN\" -> Rubik Mono One, always.\n   Everything else (headings, UI, paragraphs) -> Rubik.\n   ============================================================ */\n\n:root {\n  --font-body: \"Rubik\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-brand: \"Rubik Mono One\", \"Rubik\", ui-sans-serif, system-ui, sans-serif;\n\n  /* Weights (Rubik is variable, 300–900) */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-black: 900;\n\n  /* Type scale */\n  --text-display: 700 4rem/1.05 var(--font-body);      /* 64px — hero headlines */\n  --text-h1: 700 2.75rem/1.1 var(--font-body);          /* 44px */\n  --text-h2: 700 2.25rem/1.15 var(--font-body);         /* 36px */\n  --text-h3: 600 1.75rem/1.25 var(--font-body);         /* 28px */\n  --text-h4: 600 1.375rem/1.3 var(--font-body);         /* 22px */\n  --text-body-lg: 400 1.125rem/1.55 var(--font-body);   /* 18px */\n  --text-body: 400 1rem/1.55 var(--font-body);          /* 16px */\n  --text-body-sm: 400 0.875rem/1.5 var(--font-body);    /* 14px */\n  --text-caption: 500 0.75rem/1.4 var(--font-body);     /* 12px */\n  --text-button: 600 1rem/1 var(--font-body);           /* 16px */\n\n  /* Brand wordmark sizes (Rubik Mono One, set in --font-brand, uppercase, tracked) */\n  --text-brand-lg: 400 2.5rem/1 var(--font-brand);      /* 40px lockup / large logotype */\n  --text-brand-md: 400 1.5rem/1 var(--font-brand);      /* 24px nav/header lockup */\n  --text-brand-sm: 400 1rem/1 var(--font-brand);        /* 16px small lockup, badges */\n  --tracking-brand: 0.01em;\n\n  /* Raw size/weight/line-height primitives, for cases the shorthands above don't cover */\n  --font-size-xs: 0.75rem;\n  --font-size-sm: 0.875rem;\n  --font-size-md: 1rem;\n  --font-size-lg: 1.125rem;\n  --font-size-xl: 1.375rem;\n  --font-size-2xl: 1.75rem;\n  --font-size-3xl: 2.25rem;\n  --font-size-4xl: 2.75rem;\n  --font-size-5xl: 4rem;\n  --line-height-tight: 1.1;\n  --line-height-snug: 1.3;\n  --line-height-normal: 1.55;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   CINEMATEN — SPACING TOKENS\n   4px base unit.\n   ============================================================ */\n\n:root {\n  --space-1: 0.25rem;  /* 4px */\n  --space-2: 0.5rem;   /* 8px */\n  --space-3: 0.75rem;  /* 12px */\n  --space-4: 1rem;     /* 16px */\n  --space-5: 1.25rem;  /* 20px */\n  --space-6: 1.5rem;   /* 24px */\n  --space-8: 2rem;     /* 32px */\n  --space-10: 2.5rem;  /* 40px */\n  --space-12: 3rem;    /* 48px */\n  --space-16: 4rem;    /* 64px */\n  --space-20: 5rem;    /* 80px */\n  --space-24: 6rem;    /* 96px */\n\n  /* Layout */\n  --content-max-width: 1200px;\n  --container-padding: var(--space-6);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   CINEMATEN — RADIUS & SHADOW TOKENS\n   The mark is built from full circles and big soft-cornered\n   rectangles — the brand reads as round and friendly. Lean into\n   generous radii; avoid sharp 0–4px corners anywhere user-facing.\n   ============================================================ */\n\n:root {\n  --radius-sm: 8px;\n  --radius-md: 12px;\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* Soft, low-contrast elevation — tinted with ink, never pure black */\n  --shadow-sm: 0 1px 2px rgba(23, 26, 46, 0.06), 0 1px 1px rgba(23, 26, 46, 0.04);\n  --shadow-md: 0 4px 12px rgba(23, 26, 46, 0.08), 0 2px 4px rgba(23, 26, 46, 0.05);\n  --shadow-lg: 0 12px 32px rgba(23, 26, 46, 0.12), 0 4px 8px rgba(23, 26, 46, 0.06);\n  --shadow-brand: 0 8px 24px rgba(28, 89, 180, 0.28);\n  --shadow-accent-glow: 0 0 0 4px rgba(103, 251, 233, 0.35);\n\n  /* Motion — soft, springy, never abrupt (see readme Visual Foundations) */\n  --ease-standard: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 320ms; /* @kind other */\n}\n<\u002Fstyle>\n\n<style>\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  html, body {\n    background: #000;\n    width: 100%;\n    height: 100%;\n    overflow: hidden;\n  }\n\n  .stage {\n    position: fixed;\n    top: 0;\n    left: 0;\n    width: 1080px;\n    height: 1350px;\n    transform-origin: top left;\n  }\n\n  .post {\n    position: relative;\n    width: 1080px;\n    height: 1350px;\n    background: linear-gradient(150deg, rgba(31, 36, 80, 0.85) 15%, rgba(45, 51, 112, 0.85) 100%);\n    overflow: hidden;\n    font-family: var(--font-body);\n  }\n\n  .post-photo {\n    position: absolute;\n    top: 0;\n    left: 0;\n    width: 100%;\n    height: 900px;\n    overflow: hidden;\n    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 72%, transparent 96%);\n    mask-image: linear-gradient(to bottom, #000 0%, #000 72%, transparent 96%);\n  }\n\n  .post-photo img {\n    width: 100%;\n    height: 100%;\n    object-fit: cover;\n    object-position: 50% 35%;\n    display: block;\n  }\n\n  .post-content {\n    position: absolute;\n    left: 0;\n    right: 0;\n    bottom: 64px;\n    padding: 0 56px;\n    display: flex;\n    flex-direction: column;\n    align-items: flex-start;\n    gap: 28px;\n  }\n\n  .post-logo {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n  }\n\n  .post-logo img {\n    height: 46px;\n    width: auto;\n    display: block;\n    transform: translateY(-11px);\n    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));\n  }\n\n  .post-headline {\n    color: #ffffff;\n    font-family: var(--font-body);\n    font-weight: var(--weight-bold);\n    font-size: 3.9rem;\n    line-height: 1.06;\n    letter-spacing: -0.01em;\n    max-width: 980px;\n    text-wrap: balance;\n    margin-bottom: 44px;\n  }\n\n  .post-swipe {\n    align-self: stretch;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 14px;\n  }\n\n  .post-swipe-text {\n    display: flex;\n    align-items: center;\n    gap: 14px;\n  }\n\n  .post-swipe-text span {\n    color: #ffffff;\n    font-family: var(--font-body);\n    font-weight: var(--weight-medium);\n    font-style: italic;\n    font-size: 1.6rem;\n  }\n\n  .post-swipe svg {\n    width: 42px;\n    height: 42px;\n    stroke: #ffffff;\n    flex-shrink: 0;\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n  <div class=\"stage\" id=\"stage\">\n  <div class=\"post\" data-screen-label=\"Instagram post — The Odyssey\">\n    <div class=\"post-photo\">\n      <img id=\"heroPhoto\" src=\"__CINEMATEN_IMAGE_URL__\" alt=\"\">\n    <\u002Fdiv>\n\n    <div class=\"post-content\">\n      <h1 class=\"post-headline\">__CINEMATEN_HEADLINE__<\u002Fh1>\n      <div class=\"post-swipe\">\n        <div class=\"post-logo\">\n          <img src=\"a891241c-2e3a-4cbf-82d5-cec9c1362820\" alt=\"Cinematen.be\">\n        <\u002Fdiv>\n        <span class=\"post-swipe-text\">\n          <span>Swipe voor meer<\u002Fspan>\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <line x1=\"4\" y1=\"12\" x2=\"20\" y2=\"12\"><\u002Fline>\n            <polyline points=\"14 6 20 12 14 18\"><\u002Fpolyline>\n          <\u002Fsvg>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <script>\n    (function () {\n      var stage = document.getElementById('stage');\n      var STAGE_W = 1080, STAGE_H = 1350;\n      function fitStage() {\n        var scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);\n        stage.style.transform = 'translate(' +\n          ((window.innerWidth - STAGE_W * scale) / 2) + 'px, ' +\n          ((window.innerHeight - STAGE_H * scale) / 2) + 'px) scale(' + scale + ')';\n      }\n      fitStage();\n      window.addEventListener('resize', fitStage);\n    })();\n\n    function fitHeadlineToTwoLines() {\n      var el = document.querySelector('.post-headline');\n      if (!el) return;\n      var maxFontSize = 88; // upper bound, grown to fill width\n      var minFontSize = 30;\n      var fontSize = maxFontSize;\n      el.style.fontSize = fontSize + 'px';\n      while (fontSize > minFontSize) {\n        var lineHeight = parseFloat(getComputedStyle(el).lineHeight);\n        var lines = Math.round(el.scrollHeight / lineHeight);\n        if (lines <= 3) break;\n        fontSize -= 0.5;\n        el.style.fontSize = fontSize + 'px';\n      }\n    }\n\n    if (document.fonts && document.fonts.ready) {\n      document.fonts.ready.then(fitHeadlineToTwoLines);\n    } else {\n      window.addEventListener('load', fitHeadlineToTwoLines);\n    }\n\n    // Re-fit whenever the headline text itself changes (direct edits, CMS content, etc.)\n    // so this stays responsive to any copy, not just what was authored here.\n    (function watchHeadlineForRefit() {\n      var el = document.querySelector('.post-headline');\n      if (!el || !window.MutationObserver) return;\n      var pending = false;\n      var observer = new MutationObserver(function () {\n        if (pending) return;\n        pending = true;\n        requestAnimationFrame(function () {\n          pending = false;\n          el.style.fontSize = '';\n          fitHeadlineToTwoLines();\n        });\n      });\n      observer.observe(el, { characterData: true, childList: true, subtree: true });\n      window.addEventListener('resize', fitHeadlineToTwoLines);\n    })();\n\n    // --- Auto-frame the hero photo: detect the subject and shift the crop\n    // so it stays centered in view, instead of a fixed center-crop. ---\n    (function () {\n      var photo = document.getElementById('heroPhoto');\n      if (!photo) return;\n\n      // YCbCr skin-tone test — more robust to lighting than plain RGB rules.\n      function isSkin(r, g, b) {\n        var y = 0.299 * r + 0.587 * g + 0.114 * b;\n        var cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;\n        var cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;\n        return y > 60 && cb >= 85 && cb <= 135 && cr >= 135 && cr <= 180;\n      }\n\n      // Find the skin-tone blob that best looks like a face: compact,\n      // roughly head-sized, not a huge wood/floor/skin-colored surface,\n      // and not hugging the very bottom edge (stray hands/limbs).\n      function findFaceBlob(mask, w, h) {\n        var visited = new Uint8Array(w * h);\n        var best = null;\n        for (var start = 0; start < w * h; start++) {\n          if (!mask[start] || visited[start]) continue;\n          var stack = [start];\n          visited[start] = 1;\n          var minX = w, maxX = 0, minY = h, maxY = 0, count = 0, sumX = 0, sumY = 0;\n          while (stack.length) {\n            var idx = stack.pop();\n            var x = idx % w, y = (idx / w) | 0;\n            count++; sumX += x; sumY += y;\n            if (x < minX) minX = x;\n            if (x > maxX) maxX = x;\n            if (y < minY) minY = y;\n            if (y > maxY) maxY = y;\n            var left = idx - 1, right = idx + 1, up = idx - w, down = idx + w;\n            if (x > 0 && mask[left] && !visited[left]) { visited[left] = 1; stack.push(left); }\n            if (x < w - 1 && mask[right] && !visited[right]) { visited[right] = 1; stack.push(right); }\n            if (up >= 0 && mask[up] && !visited[up]) { visited[up] = 1; stack.push(up); }\n            if (down < w * h && mask[down] && !visited[down]) { visited[down] = 1; stack.push(down); }\n          }\n\n          var bboxW = maxX - minX + 1, bboxH = maxY - minY + 1;\n          var areaFrac = count / (w * h);\n          var aspect = Math.max(bboxW, bboxH) / Math.max(1, Math.min(bboxW, bboxH));\n          var fracY = (sumY / count) / h;\n\n          var plausibleFace =\n            areaFrac > 0.0015 && areaFrac < 0.04 &&\n            bboxW < w * 0.35 && bboxH < h * 0.35 &&\n            aspect < 2.2 &&\n            fracY < 0.78;\n\n          if (plausibleFace && (!best || count > best.count)) {\n            best = { count: count, cx: sumX / count, cy: sumY / count };\n          }\n        }\n        return best;\n      }\n\n      function autoFrame() {\n        var iw = photo.naturalWidth, ih = photo.naturalHeight;\n        if (!iw || !ih) return;\n\n        // Analyze at a small resolution for speed.\n        var scale = 160 / Math.max(iw, ih);\n        var w = Math.max(1, Math.round(iw * scale));\n        var h = Math.max(1, Math.round(ih * scale));\n\n        var canvas = document.createElement('canvas');\n        canvas.width = w;\n        canvas.height = h;\n        var ctx = canvas.getContext('2d');\n\n        var focalXpx = iw / 2, focalYpx = ih / 2; // default: center\n\n        try {\n          ctx.drawImage(photo, 0, 0, w, h);\n          var data = ctx.getImageData(0, 0, w, h).data;\n\n          var lum = new Float32Array(w * h);\n          var skinMask = new Uint8Array(w * h);\n          for (var p = 0; p < w * h; p++) {\n            var r = data[p * 4], g = data[p * 4 + 1], b = data[p * 4 + 2];\n            lum[p] = 0.2126 * r + 0.7152 * g + 0.0722 * b;\n            skinMask[p] = isSkin(r, g, b) ? 1 : 0;\n          }\n\n          var faceBlob = findFaceBlob(skinMask, w, h);\n\n          if (faceBlob) {\n            // A compact, face-sized skin blob — most likely a person's face.\n            focalXpx = (faceBlob.cx / scale);\n            focalYpx = (faceBlob.cy / scale);\n          } else {\n            // No plausible face found — fall back to the most detailed\n            // (highest edge-energy) region of the frame.\n            var edgeTotal = 0, edgeSumX = 0, edgeSumY = 0;\n            for (var y = 1; y < h - 1; y++) {\n              for (var x = 1; x < w - 1; x++) {\n                var i = y * w + x;\n                var gx = lum[i + 1] - lum[i - 1];\n                var gy = lum[i + w] - lum[i - w];\n                var energy = Math.sqrt(gx * gx + gy * gy);\n                edgeTotal += energy;\n                edgeSumX += energy * x;\n                edgeSumY += energy * y;\n              }\n            }\n            if (edgeTotal > 0) {\n              focalXpx = (edgeSumX / edgeTotal) / scale;\n              focalYpx = (edgeSumY / edgeTotal) / scale;\n            }\n          }\n        } catch (e) {\n          // Canvas read blocked — keep the default center focal point.\n        }\n\n        var container = document.querySelector('.post-photo');\n        var cw = container.clientWidth, ch = container.clientHeight;\n        var containerRatio = cw / ch;\n        var imgRatio = iw / ih;\n\n        var sw, sh;\n        if (imgRatio > containerRatio) {\n          sh = ih;\n          sw = ih * containerRatio;\n        } else {\n          sw = iw;\n          sh = iw / containerRatio;\n        }\n\n        var posX = 50, posY = 50;\n        var maxOffsetX = iw - sw;\n        var maxOffsetY = ih - sh;\n\n        if (maxOffsetX > 0) {\n          var idealSx = Math.max(0, Math.min(maxOffsetX, focalXpx - sw / 2));\n          posX = (idealSx / maxOffsetX) * 100;\n        }\n        if (maxOffsetY > 0) {\n          var idealSy = Math.max(0, Math.min(maxOffsetY, focalYpx - sh / 2));\n          posY = (idealSy / maxOffsetY) * 100;\n        }\n\n        photo.style.objectPosition = posX.toFixed(1) + '% ' + posY.toFixed(1) + '%';\n      }\n\n      if (photo.complete && photo.naturalWidth) {\n        autoFrame();\n      } else {\n        photo.addEventListener('load', autoFrame);\n      }\n    })();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
